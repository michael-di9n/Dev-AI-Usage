name: Claude

# Interactive mode: no `prompt` input, so this does nothing until it is mentioned.
# See exercises/03-github-actions.md.
on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]
  issues:
    types: [opened, assigned]

jobs:
  claude:
    if: |
      contains(github.event.comment.body, '@claude') ||
      contains(github.event.review.body, '@claude') ||
      contains(github.event.issue.body, '@claude') ||
      contains(github.event.issue.title, '@claude')
    runs-on: ubuntu-latest
    permissions:
      contents: write # so "@claude fix this" can push a commit
      pull-requests: write
      issues: write
      actions: read # so it can read the ci.yml run it is being asked about
      id-token: write # required: the action mints its App token from this
    env:
      # `secrets` is not available in a job-level `if`, so the guard sits on the
      # step. A clone with no secret set skips rather than fails.
      HAS_CREDENTIAL: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - if: env.HAS_CREDENTIAL == 'true'
        uses: anthropics/claude-code-action@v1
        with:
          # Swap for `anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}` if you
          # would rather bill a console key than a subscription.
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          claude_args: "--model claude-opus-5"
