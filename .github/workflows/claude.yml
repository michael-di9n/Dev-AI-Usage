name: Claude

# Interactive mode: no `prompt` input, so this does nothing until it is
# mentioned. See exercises/03-github-actions.md.
#
# Note: `issue_comment` and `pull_request_review*` workflows always run the copy
# of this file on the DEFAULT branch, never the copy in the pull request. Fixes
# to this file only take effect once merged.
on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]
  issues:
    types: [opened, assigned]

jobs:
  claude:
    if: |
      contains(github.event.comment.body, '@claude') ||
      contains(github.event.review.body, '@claude') ||
      contains(github.event.issue.body, '@claude') ||
      contains(github.event.issue.title, '@claude')
    runs-on: ubuntu-latest
    permissions:
      contents: write # so "@claude fix this" can push a commit
      pull-requests: write # so it can post and update its reply
      issues: write
      actions: read # so it can read a failed workflow run it is asked about
      id-token: write
    env:
      # `secrets` is not available in a job-level `if`, so the guard sits on the
      # step. A clone with no secret set skips rather than fails.
      #
      # This must name the SAME secret the step below passes. Guarding on one
      # secret and authenticating with another is a silent no-op: the step is
      # skipped, the job goes green, and nothing ever replies.
      HAS_CREDENTIAL: ${{ secrets.ANTHROPIC_API_KEY != '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # Without these a follow-up can read tests but not run them, so "@claude
      # prove that flag" is answered from reasoning alone. `npm ci` is its own
      # step rather than an allowed tool: it is deterministic, it warms the
      # cache, and an install failure stays out of Claude's turn budget.
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci

      - if: env.HAS_CREDENTIAL == 'true'
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          # GITHUB_TOKEN is supplied by the runner from the `permissions` block
          # above; there is no token to add as a secret.
          # File edits, commits and comment management are base tools. Bash is
          # not, so the checks have to be named. `npm run run` and
          # `npm run ui-test` are deliberately absent: they read the real corpus
          # and want a dev server.
          claude_args: |
            --model claude-sonnet-5
            --allowedTools "Bash(npm test),Bash(npm run typecheck),Bash(npm run lint)"
