name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      # playwright-core drives the Chrome already on the runner, so there is
      # no browser download step and no cache to warm.
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

      # CI has no transcripts, so this is exactly the fresh-clone state a new
      # user sees. Checking it here is what stops "$0.00" coming back.
      - name: UI checks against a fresh install
        run: |
          npm start -- --port 3000 &
          npx wait-on -t 60000 http://localhost:3000/api/otlp/health
          npm run ui-test -- --empty
        env:
          DEV_AI_USAGE_OBSERVABILITY: "off"

      - name: Upload screenshots from failed UI checks
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ui-test-screenshots
          path: data/ui-tests/
          if-no-files-found: ignore
