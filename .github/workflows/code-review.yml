name: Code review

# Automation mode: a `prompt` input means this runs on the event itself, with no
# @claude mention. See exercises/03-github-actions.md.
on:
  pull_request:
    types: [ready_for_review]

concurrency:
  group: code-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    # A fork pull request on a public repo is handed no secrets, so this would
    # fail at authentication rather than review anything.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read # reviews, never pushes
      pull-requests: write # required: this is what lets it post the review
      issues: read
      actions: read
      id-token: write
    env:
      # Must name the same secret the step passes, or the step silently skips
      # and the job still goes green.
      HAS_CREDENTIAL: ${{ secrets.ANTHROPIC_API_KEY != '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # so a local `git diff` against the base also works

      - if: env.HAS_CREDENTIAL == 'true'
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          # GITHUB_TOKEN comes from the runner via `permissions` above.
          #
          # --allowedTools is what makes this workflow post. Without it the
          # review is written to the job log, where nobody reads it. The list is
          # deliberately comment-only: no Edit, no push, no arbitrary Bash.
          claude_args: |
            --model claude-haiku-4-5
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Write,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Review this pull request against the house rules in AGENTS.md at the
            repository root. Read AGENTS.md first. It is the contract, not a
            summary of one.

            The PR branch is already checked out here. Get the diff with
            `gh pr diff ${{ github.event.pull_request.number }}`.

            Look only at the diff. Judge each rule PASS or FLAG, and give the
            file and line for every FLAG. A rule you cannot evaluate from the
            diff is PASS, not a question.

            1. Flag flivirous explanations. Check if the descriptions are too verbose

            2. Identify inconsistancies with the UI, if the functionality exist else where then reuse

            3. Avoid explaining when it can be done using an icon

            4. Check for functions that can take exponential or polynomial time. Effieinecy is important to make
            this application run smoothly.

            5. Data should not leave this machine
               
            6. Adhere KISS and SOLID principles. Do not overcomplicate things when
            it can be done simplier and in less lines of code

            7. Follow DRY (Dont repeat yourself) if the functionility exist else where better to resuse than
            redefine



            Write the comment body to /tmp/review.md, then post it with
            `gh pr comment ${{ github.event.pull_request.number }} --body-file /tmp/review.md`.
            Use --body-file, never --body: the body contains backticks, quotes
            and $ from the code it quotes, and passing that through the shell
            truncates or mangles it.

            Start with a less than 15 words capturing: what was done and if its good to merge?
            
            Then write a summary on what you found good and why
            Then what you found bad about the PR
            Disucss with reasoning in simple human readible language the suggested fix

            If its an inline comment then be clear on what was discovered and how adn then suggested fix
            
            If there are no issues, then atleast add one inline comment commenting on what was done well
            .Use
            `mcp__github_inline_comment__create_inline_comment` (with
            `confirmed: true`) for a flag that belongs on a specific line - a
            reply to an inline comment carries the diff hunk, so a follow-up
            question arrives with the code already in context.

            End the comment with exactly this line and nothing after it:
            "Reply to any flag with @claude to discuss or fix it."
