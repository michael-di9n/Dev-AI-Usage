name: House rules

# Automation mode: a `prompt` input means this runs on the event itself, with no
# @claude mention. See exercises/03-github-actions.md.
on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  house-rules:
    # A fork pull request on a public repo is handed no secrets, so this would
    # fail at authentication rather than review anything.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read # reviews, never pushes
      pull-requests: write
      issues: read
      actions: read
      id-token: write
    env:
      HAS_CREDENTIAL: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the review needs the base commit to diff against

      - if: env.HAS_CREDENTIAL == 'true'
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          claude_args: "--model claude-opus-5"
          prompt: |
            Review this pull request against the five rules in AGENTS.md at the
            repository root. Read AGENTS.md first. It is the contract, not a
            summary of one.

            Look only at the diff. Judge each rule PASS or FLAG, and give the
            file and line for every FLAG. A rule you cannot evaluate from the
            diff is PASS, not a question.

            1. A missing number is never a zero.
               A source that cannot answer something renders an em dash and names
               the source that would answer it. FLAG any new `?? 0`, `|| 0`, or
               `.toFixed()` on a nullable that can reach a cell in src/app/ or
               src/components/. Note Number(null) is 0, so a `?? 0` on a cost or
               duration is the specific bug this rule exists to stop. A COUNT
               genuinely is zero when nothing matched; a price is not. The
               matching UI assertion is "Setup never hides a missing source" in
               src/ui-testing/checks.ts, and a new nullable column needs one too.

            2. Every finding carries its evidence.
               A new Detector added to ALL_DETECTORS in
               src/analyze/detectors/index.ts must set the `explanation` required
               by src/analyze/Detector.ts to a sentence naming the mechanism, not
               the category. A new assertion in src/ui-testing/checks.ts must set
               the `why` required by src/ui-testing/UiCheck.ts to the harm a user
               suffers, not a restatement of the assertion.

            3. The verdict router is a rule table, not a model.
               FLAG anything that makes src/analyze/VerdictRouter.ts depend on a
               model, a network call, an API key, or ClusterLabeller. Adding an
               entry to CI_MARKERS or SCRIPT_MARKERS is fine and expected. Models
               may name things. They never decide them.

            4. Cost is derived and labelled as such.
               Derived cost is never presented as a bill, and never reconciled
               against Claude Code's own figure - they count different messages on
               purpose. See the comment on costSecondOpinion in
               src/db/QueryRepository.ts. FLAG new user-facing copy calling a
               derived figure "spend", "billed", "actual" or "invoice", and FLAG
               new arithmetic that subtracts one figure from the other.

            5. Nothing leaves the machine.
               This tool sends no prompt, screenshot or transcript anywhere. The
               only outbound call in src/ is the read-only Anthropic Admin usage
               fetch in src/ingest/analytics/AnalyticsSource.ts, and it is
               asserted as the only one in tests/no-egress.test.ts. FLAG any new
               fetch, model SDK import, or child process spawned to reach a
               model. Any new outbound payload passes through
               src/analyze/Redactor.ts first.

            Then the two traps at the end of AGENTS.md:
            - CLAUDE_CONFIG_DIR is read before ~/.claude. FLAG any reordering or
              "simplification" of resolveClaudeProjectsDir in src/config.ts.
            - cost-state is not ground truth. FLAG any new validation built on it.

            And one documentation rule, because tests/docs.test.ts enforces it and
            its failure message reads as unrelated: in any changed markdown file,
            every `npm run X` must be a key in package.json scripts, every
            DEV_AI_USAGE_* name must appear literally in src/config.ts, and every
            relative link must resolve from that file's own directory.

            Post one review comment. Open with the verdict on its own line:
            "House rules: N flags." Then list the flags in rule order, each with
            the file, the line, and the single change that clears it. If there are
            none, say so in one line and stop. Do not summarise the pull request,
            do not praise it, and do not comment on style, naming or test
            coverage - a long comment is an unread comment.
